                },

                    desc: 'Combines comfortable family seating with fun amenities designed specifically for children.', showCredits: 0
                }

            const categorySelector = document.getElementById('categorySelector');
            const formatSelector = document.getElementById('formatSelector');

            // Handle manual category change
            categorySelector.addEventListener('change', function() {
                formatSelector.innerHTML = '<option value="" selected disabled>-- Choose a Format --</option>';
                const selectedCategory = this.value;
                
                // Instantly hide the previously loaded format data
                const displayArea = document.getElementById('format-display-area');
                if (displayArea) {
                    displayArea.style.display = 'none';
                }
                
                if (categories[selectedCategory]) {
                    categories[selectedCategory].forEach(formatKey => {
                        const opt = document.createElement('option');
                        opt.value = formatKey;
                        opt.textContent = formatData[formatKey].name;
                        formatSelector.appendChild(opt);
                    });
                    formatSelector.disabled = false;
                } else {
                    formatSelector.disabled = true;
                }
            });

            // Check URL for active format on page load
            const urlParams = new URLSearchParams(window.location.search);
            const currentFormat = urlParams.get('f');

            if (currentFormat && formatData[currentFormat]) {
                // Find which category this format belongs to
                let currentCategory = null;
                for (const [catKey, formatKeys] of Object.entries(categories)) {
                    if (formatKeys.includes(currentFormat)) {
                        currentCategory = catKey;
                        break;
                    }
                }

                // If a category was found, pre-populate the dropdowns
                if (currentCategory) {
                    categorySelector.value = currentCategory;
                    
                    categories[currentCategory].forEach(formatKey => {
                        const opt = document.createElement('option');
                        opt.value = formatKey;
                        opt.textContent = formatData[formatKey].name;
                        formatSelector.appendChild(opt);
                    });
                    
                    formatSelector.disabled = false;
                    formatSelector.value = currentFormat;
                }
                
                // Conditionally build the credits HTML
                let creditsHtml = '';
                const creditNum = formatData[currentFormat].showCredits;
                
                if (creditNum > 0 && creditsDatabase[creditNum]) {
                    creditsHtml = `
                        <div class="mt-4 mb-5">
                            ${creditsDatabase[creditNum]}
                        </div>
                    `;
                }

                // Synchronous check to definitively block garbage HTML pages acting as CSV files
                let hasValidCsv = false;
                try {
                    var xhr = new XMLHttpRequest();
                    // Using GET to inspect the actual response body content
                    xhr.open('GET', formatData[currentFormat].csv, false); 
                    xhr.send();
                    if (xhr.status >= 200 && xhr.status < 300) {
                        var responseText = xhr.responseText.trim();
                        // If it starts with '<', it is an HTML error page or scrape redirect, not a CSV.
                        if (responseText.length > 0 && !responseText.startsWith('<')) {
                            hasValidCsv = true;
                        }
                    }
                } catch(e) {
                    // Fail silently and leave hasValidCsv as false
                }

                let tableOutput = '';
                if (hasValidCsv) {
                    tableOutput = `
                        <div class="table-container" csvfile="${formatData[currentFormat].csv}" fullwidth="false" sortcolumn="3" sortorder="asc" columnpriority="2,3,1,0" dontbreakcolumns="0,1">
                            <table id="dynamic-table">
                                <thead></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    `;
                } else {
                    tableOutput = `
                        <div class="alert alert-secondary mt-4 text-center border-dark" role="alert">
                            <strong>Location Data Pending:</strong> The master list for this format is currently being compiled and will be updated soon.
                        </div>
                    `;
                }

                // Write the precise HTML structure. Image is hidden by default and only shows on successful load.
                document.write(`
                    <div id="format-display-area">
                        <div class="mt-3" style="margin-bottom: 15px !important; min-height: 80px;">
                            <img src="${formatData[currentFormat].img}" alt="${formatData[currentFormat].name} Logo" class="format-logo mx-auto" style="display: none;" onload="this.style.display='block'" onerror="this.style.display='none'">
                            <p class="mt-3 mb-0 text-justify">${formatData[currentFormat].desc}</p>
                        </div>
                        ${tableOutput}
                        ${creditsHtml}
                    </div>
                `);
            }

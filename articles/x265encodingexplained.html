<!DOCTYPE html>
<html lang="en">
<head>
	<title>Mastering Archival Encoding: x265, Dolby Vision, and the Power of Apple Silicon</title>

	<!-- Bootstrap CSS -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">	
	
	<!-- Social Media Meta Tag for Link Sharing -->
	<meta property="og:image" content="https://www.shreytyagi.com/articles/encoding_masterclass/IMG_COVER.jpg">
	<meta property="og:title" content="Mastering Archival Encoding: x265, Dolby Vision, and the Power of Apple Silicon">

	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

	<!-- JQuery -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
	
	<!-- Bootstrap JS -->
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
	
	<!-- Local CSS -->
	<link href="/css/style.css" rel="stylesheet">

	<!-- Local JS -->
	<script src="/js/script.js"></script>

    <style>
        /* ==========================================================================
           ENCODING STUDIO ISOLATION & DESIGN SYSTEM
           Prevents parent .text-justify from stretching UI labels & terminal code
           ========================================================================== */
        .encoding-studio,
        .encoding-studio * {
            text-align: left !important;
            box-sizing: border-box;
        }

        .encoding-studio {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e293b;
            margin-top: 2rem;
            margin-bottom: 3.5rem;
        }

        /* Studio Header Banner */
        .studio-intro {
            margin-bottom: 1.5rem;
        }
        .studio-intro h4 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.4rem;
            letter-spacing: -0.2px;
        }
        .studio-intro p {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.55;
            margin-bottom: 0;
        }

        /* System Compatibility Card */
        .guide-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-left: 4px solid #2563eb;
            padding: 1.25rem 1.4rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .guide-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 0.85rem;
            margin-bottom: 0.85rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .guide-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }
        .guide-select {
            width: auto !important;
            min-width: 230px;
            height: 34px !important;
            padding: 0.25rem 0.65rem !important;
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            color: #1d4ed8 !important;
            background-color: #ffffff !important;
            border: 1px solid #93c5fd !important;
            border-radius: 6px !important;
        }
        .guide-code {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            margin: 0.45rem 0;
            overflow-x: auto;
            white-space: pre;
        }

        /* Major Section Headers (1, 2, 3) */
        .studio-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 0.7rem 1.1rem;
            border-radius: 7px;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-left: 4px solid #3b82f6;
        }
        .studio-section-header h5 {
            font-size: 0.92rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin: 0;
            color: #ffffff;
        }
        .section-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            background-color: #1e293b;
            color: #93c5fd;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        /* Console Panels */
        .console-panel {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .console-panel-muted {
            background-color: #f8fafc;
        }
        .panel-header-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.65rem;
            margin-bottom: 1rem;
        }
        .panel-subtitle {
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #334155;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .panel-subtitle-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #3b82f6;
        }
        .panel-note {
            font-size: 0.73rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Responsive CSS Grids (Designed for 650px–800px Article Columns) */
        .studio-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: end;
        }
        .studio-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.9rem;
            align-items: end;
        }
        .studio-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.85rem;
            align-items: end;
        }
        .studio-grid-6 {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.65rem;
            align-items: end;
        }
        .studio-grid-cpu {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 0.9rem;
            align-items: end;
        }

        @media (max-width: 640px) {
            .studio-grid-3,
            .studio-grid-cpu {
                grid-template-columns: 1fr;
            }
            .studio-grid-4 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .studio-grid-6 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 480px) {
            .studio-grid-2,
            .studio-grid-4 {
                grid-template-columns: 1fr;
            }
        }

        /* Labels & Inline Header Toggles */
        .field-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
            min-height: 20px;
        }
        .pro-label {
            font-size: 0.70rem;
            letter-spacing: 0.5px;
            font-weight: 700;
            text-transform: uppercase;
            color: #475569;
            margin: 0;
            display: block;
            line-height: 1.2;
        }

        /* Form Controls & Disabled States */
        .encoding-studio .form-control {
            height: 36px;
            padding: 0.35rem 0.65rem;
            font-size: 0.84rem;
            font-weight: 500;
            color: #0f172a;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .encoding-studio .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .encoding-studio .form-control:disabled,
        .encoding-studio .form-control[readonly] {
            background-color: #f1f5f9 !important;
            border-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
        }
        .encoding-studio .input-group-text {
            height: 36px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #475569;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0 0.65rem;
        }

        /* Compact Switch Styling */
        .encoding-studio .custom-control.custom-switch {
            padding-left: 2.1rem;
            min-height: 1.25rem;
            display: flex;
            align-items: center;
        }
        .encoding-studio .custom-control-label {
            font-size: 0.76rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            user-select: none;
            line-height: 1.25;
            padding-top: 1px;
        }

        /* Live Geometry Telemetry Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .telemetry-cell {
            padding: 0.55rem 0.85rem;
            border-right: 1px solid #1e293b;
        }
        .telemetry-cell:last-child {
            border-right: none;
        }
        .telemetry-label {
            display: block;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.15rem;
        }
        .telemetry-val {
            display: block;
            color: #34d399;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 576px) {
            .telemetry-grid {
                grid-template-columns: 1fr;
            }
            .telemetry-cell {
                border-right: none;
                border-bottom: 1px solid #1e293b;
            }
        }

        /* Rate Control Slider Sub-Cards */
        .slider-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 0.85rem 1rem;
        }
        .slider-val-pill {
            background-color: #dbeafe;
            color: #1d4ed8;
            font-weight: 700;
            font-size: 0.76rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .slider-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: #64748b;
            margin-top: 0.25rem;
            font-weight: 500;
        }

        /* Uniform Feature Switch Cards */
        .switch-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0.65rem 0.85rem;
            display: flex;
            align-items: center;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .switch-card-hdr {
            background-color: #f8fafc;
            border-color: #93c5fd;
        }

        /* Terminal Command Output Cards */
        .terminal-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1.15rem;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.1);
        }
        .terminal-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            background-color: #1e293b;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #334155;
        }
        .terminal-title {
            font-size: 0.80rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.3px;
            margin: 0;
        }
        .terminal-desc {
            font-size: 0.76rem;
            color: #94a3b8;
            padding: 0.55rem 1rem 0 1rem;
            margin: 0;
        }
        .terminal-desc code {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }
        .cmd-box {
            background-color: transparent;
            color: #e2e8f0;
            padding: 0.85rem 1rem 1rem 1rem;
            margin: 0;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.79rem;
            line-height: 1.55;
            text-align: left !important;
        }
        .btn-copy-terminal {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.85rem;
            border-radius: 5px;
            border: none;
            background-color: #2563eb;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .btn-copy-terminal:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }
        .btn-copy-success {
            background-color: #10b981 !important;
            color: #ffffff !important;
        }
    </style>
</head>
